name: Options risk validation
on:
  pull_request:
    paths:
      - 'src/OptionsRisk.Core/**'
      - 'src/Broker.Service/**'
      - 'src/frontend/**'
      - 'tests/OptionsRisk.Core.Tests/**'
      - '.github/workflows/options-risk-validation.yml'
  workflow_dispatch:
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/OptionsRisk.Core.Tests/OptionsRisk.Core.Tests.csproj --configuration Release
      - run: dotnet build src/Broker.Service/Broker.Service.csproj --configuration Release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
